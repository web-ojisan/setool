<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SE BOARD // サウンドボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1019;
    --bg-vignette: radial-gradient(ellipse at center, #1a1c2c 0%, #0f1019 70%);
    --panel:#1b1d2e;
    --panel-light:#242742;
    --line: rgba(255,255,255,0.06);
    --accent-cyan:#4ce0d2;
    --accent-magenta:#ff5ca8;
    --accent-amber:#ffc857;
    --text:#f3f3f8;
    --text-dim:#8b8fa3;
    --font-display: 'Press Start 2P', monospace;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background: var(--bg-vignette);
    color: var(--text);
    font-family: var(--font-body);
    min-height:100vh;
    overscroll-behavior:none;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 14px 40px;
  }

  /* ---------- Sections ---------- */
  .board{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  section.panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 16px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .panel-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 0 0 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform:uppercase;
  }
  .panel-title .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--accent-magenta);
    box-shadow: 0 0 8px var(--accent-magenta);
  }

  /* ---------- SE grid ---------- */
  .se-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 10px;
  }

  .se-btn{
    position:relative;
    border:none;
    cursor:pointer;
    border-radius: 16px;
    padding: 14px 6px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    font-family: var(--font-body);
    font-weight:600;
    font-size: 11px;
    color: #101223;
    background: linear-gradient(160deg, var(--btn-c1), var(--btn-c2));
    box-shadow:
      0 5px 0 var(--btn-shadow),
      0 8px 14px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(255,255,255,0.5);
    transition: transform .06s ease, box-shadow .06s ease;
    user-select:none;
    overflow:hidden;
  }
  .se-btn .icon{ font-size:22px; line-height:1; filter: drop-shadow(0 1px 0 rgba(255,255,255,0.4)); }
  .se-btn span.label{ letter-spacing: 0.2px; }

  .se-btn.c-cyan{ --btn-c1: #8ff5ec; --btn-c2: var(--accent-cyan); --btn-shadow:#2a9a90; }
  .se-btn.c-magenta{ --btn-c1: #ffa8cf; --btn-c2: var(--accent-magenta); --btn-shadow:#b23a72; }
  .se-btn.c-amber{ --btn-c1: #ffe19c; --btn-c2: var(--accent-amber); --btn-shadow:#b3893c; }

  .se-btn:active,
  .se-btn.is-pressed{
    transform: translateY(4px);
    box-shadow:
      0 1px 0 var(--btn-shadow),
      0 3px 6px rgba(0,0,0,0.4),
      inset 0 1px 1px rgba(255,255,255,0.5);
  }

  .se-btn::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius: inherit;
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 60%);
    opacity:0;
    transform: scale(0.4);
    pointer-events:none;
  }
  .se-btn.is-pressed::after{
    animation: burst .35s ease-out;
  }
  @keyframes burst{
    0%{ opacity:0.55; transform:scale(0.3); }
    100%{ opacity:0; transform:scale(1.6); }
  }

  /* ---------- BGM volume toggle ---------- */
  .bgm-volume-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .bgm-volume-label{
    font-family: var(--font-mono);
    font-size:11px;
    color: var(--text-dim);
    letter-spacing:1px;
    white-space:nowrap;
  }
  .toggle-group{
    display:flex;
    background: var(--panel-light);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    gap:3px;
  }
  .toggle-btn{
    border:none;
    cursor:pointer;
    font-family: var(--font-mono);
    font-size:11px;
    font-weight:600;
    letter-spacing:0.5px;
    padding: 6px 12px;
    border-radius: 999px;
    background: transparent;
    color: var(--text-dim);
    transition: background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .toggle-btn.active{
    background: var(--accent-cyan);
    color:#101223;
  }

  /* ---------- BGM list ---------- */
  .bgm-list{ display:flex; flex-direction:column; gap:10px; }

  .bgm-row{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--panel-light);
    border:1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .bgm-info{ flex:1; min-width:0; }
  .bgm-name{ font-size:13px; font-weight:600; }
  .bgm-sub{ font-size:11px; color:var(--text-dim); font-family: var(--font-mono); margin-top:2px; }

  .viz{ display:flex; align-items:flex-end; gap:2px; height:16px; width:26px; flex-shrink:0; }
  .viz i{
    display:block; width:3px; background: var(--accent-cyan);
    border-radius:1px; height:20%;
    opacity:0.35;
  }
  .bgm-row.playing .viz i{ opacity:1; animation: bounce 0.9s ease-in-out infinite; }
  .bgm-row.playing .viz i:nth-child(1){ animation-delay: -0.6s; }
  .bgm-row.playing .viz i:nth-child(2){ animation-delay: -0.3s; }
  .bgm-row.playing .viz i:nth-child(3){ animation-delay: -0.9s; }
  .bgm-row.playing .viz i:nth-child(4){ animation-delay: -0.15s; }
  @keyframes bounce{
    0%,100%{ height:20%; }
    50%{ height:100%; }
  }

  .bgm-btn{
    border:none;
    cursor:pointer;
    font-family: var(--font-mono);
    font-weight:600;
    font-size:11px;
    letter-spacing:1px;
    padding: 8px 14px;
    border-radius: 10px;
    color:#101223;
    background: var(--accent-amber);
    box-shadow: 0 3px 0 #b3893c;
    transition: transform .06s ease, box-shadow .06s ease;
    flex-shrink:0;
  }
  .bgm-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #b3893c; }
  .bgm-btn.is-playing{ background: var(--accent-magenta); box-shadow: 0 3px 0 #b23a72; }

  /* ---------- Unlock hint ---------- */
  @media (prefers-reduced-motion: reduce){
    .bgm-row.playing .viz i{ animation:none; height:70%; }
  }
</style>
</head>
<body>

  <div class="board">

    <section class="panel">
      <p class="panel-title"><span class="dot"></span>こうかおん SE</p>
      <div class="se-grid" id="seGrid"></div>
    </section>

    <section class="panel">
      <p class="panel-title"><span class="dot" style="background:var(--accent-cyan); box-shadow:0 0 8px var(--accent-cyan);"></span>BGM ループ</p>

      <div class="bgm-volume-row">
        <span class="bgm-volume-label">BGM音量</span>
        <div class="toggle-group" id="bgmVolumeToggle">
          <button class="toggle-btn" data-mode="low">小さめ</button>
          <button class="toggle-btn" data-mode="same">SEと同じ</button>
        </div>
      </div>

      <div class="bgm-list" id="bgmList"></div>
    </section>

  </div>

<script>
(function(){
  "use strict";

  /* ================= Audio Engine ================= */
  let audioCtx = null;
  let seGain = null;   // 効果音バス
  let bgmGain = null;  // BGM専用バス

  const SE_LEVEL = 0.8;
  const BGM_LEVEL_LOW = 0.35;
  const BGM_LEVEL_SAME = SE_LEVEL;
  let bgmVolumeMode = "low"; // "low" or "same"

  function bgmLevel(){
    return (bgmVolumeMode === "same") ? BGM_LEVEL_SAME : BGM_LEVEL_LOW;
  }

  function applyBgmVolume(){
    if(bgmGain) bgmGain.gain.value = bgmLevel();
    // MediaElementSourceに繋げなかった環境向けのフォールバック
    Object.keys(bgmAudioEls).forEach(id=>{
      if(!bgmMediaNodes[id]) bgmAudioEls[id].volume = bgmLevel();
    });
  }

  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      seGain = audioCtx.createGain();
      seGain.gain.value = SE_LEVEL;
      seGain.connect(audioCtx.destination);

      bgmGain = audioCtx.createGain();
      bgmGain.connect(audioCtx.destination);
      applyBgmVolume();
    }
    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }

  function tone(freq, start, dur, type, gainPeak, dest){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(gainPeak || 0.3, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(dest || seGain);
    osc.start(start);
    osc.stop(start + dur + 0.02);
    return osc;
  }

  function sweep(freqFrom, freqTo, start, dur, type, gainPeak, dest){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "sawtooth";
    osc.frequency.setValueAtTime(freqFrom, start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqTo,1), start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(gainPeak || 0.3, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain);
    gain.connect(dest || seGain);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  function noiseBurst(start, dur, gainPeak, filterFreq){
    const bufferSize = audioCtx.sampleRate * dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(filterFreq || 2000, start);
    if(filterFreq){
      filter.frequency.exponentialRampToValueAtTime(200, start + dur);
    }
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(gainPeak || 0.5, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(seGain);
    noise.start(start);
    noise.stop(start + dur);
  }

  /* ========== audio-extract 取り込み：共通プリミティブ（seGainへ出力） ========== */
  function xac(){ ensureAudio(); return audioCtx; }

  // extracted系 tone(freq, dur, type, vol, when)（choitashi-simon 系）
  function xTone(freq, dur, type, vol, when){
    const ctx = xac(), t = ctx.currentTime + (when || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol == null ? 0.25 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(seGain);
    o.start(t); o.stop(t + dur + 0.05);
  }

  // extracted系 tone(freq, dur, delay, type, vol)（friends-masu / hanbun-hanbun 系）
  function xToneD(freq, dur, delay, type, vol){
    const ctx = xac(), t = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol == null ? 0.12 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(seGain);
    o.start(t); o.stop(t + dur);
  }

  // extracted系 beep(freq, dur, type, gain)（reaction-duel / timing-duel 系）
  function xBeep(freq, dur, type, gain){
    const ctx = xac();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.value = gain || 0.06;
    o.connect(g); g.connect(seGain);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.stop(ctx.currentTime + dur + 0.02);
  }

  // 減衰ホワイトノイズbuffer（reaction-duel createNoiseBuffer 相当）
  function xNoiseDecay(dur, decayPow){
    const ctx = xac();
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0), p = decayPow || 2;
    for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, p);
    return buf;
  }

  // ローパスを掃引するノイズ（choitashi-simon noise() 相当）
  function xNoiseSweep(dur, fFrom, fTo, vol){
    const ctx = xac(), t = ctx.currentTime;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(fFrom, t);
    f.frequency.exponentialRampToValueAtTime(fTo, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol == null ? 0.5 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(seGain);
    src.start(t);
  }

  // 0.2秒ホワイトノイズ（ドラム等で使い回し）
  let xNoiseBuf = null;
  function xNoise2(){
    const ctx = xac();
    if(!xNoiseBuf){
      xNoiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.2 | 0, ctx.sampleRate);
      const d = xNoiseBuf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return xNoiseBuf;
  }

  // mp3をseGain経由でワンショット再生（reaction-duel WIN_SOUNDS 相当）
  const seAudioEls = {};
  function sePlayFile(url){
    ensureAudio();
    let el = seAudioEls[url];
    if(!el){
      el = new Audio(url);
      seAudioEls[url] = el;
      try { audioCtx.createMediaElementSource(el).connect(seGain); }
      catch(e){ el.volume = SE_LEVEL; }
    }
    try { el.currentTime = 0; } catch(e){}
    el.play().catch(()=>{});
  }

  /* ---------- SE definitions ---------- */
  const SE_PLAYERS = {
    powerup(){
      const t = audioCtx.currentTime;
      [523,659,784,1046].forEach((f,i)=> tone(f, t + i*0.07, 0.12, "square", 0.28));
    },
    explosion(){
      const t = audioCtx.currentTime;
      noiseBurst(t, 0.5, 0.6, 1800);
      sweep(140, 40, t, 0.4, "sawtooth", 0.25);
    },
    victory(){
      const t = audioCtx.currentTime;
      [523,659,784,1046,1319,1568].forEach((f,i)=> tone(f, t + i*0.09, 0.18, "square", 0.32));
    },
    error(){
      const t = audioCtx.currentTime;
      tone(200, t, 0.15, "square", 0.3);
      tone(150, t+0.16, 0.2, "square", 0.3);
    }
  };

  const SE_LIST = [
    {id:"powerup",   label:"パワーアップ", icon:"⭐", color:"magenta"},
    {id:"explosion", label:"爆発",         icon:"💥", color:"amber"},
    {id:"victory",   label:"勝利",         icon:"🏆", color:"amber"},
    {id:"error",     label:"エラー",       icon:"❌", color:"cyan"}
  ];

  /* ---------- audio-extract から取り込んだ効果音（重複を除いた代表） ---------- */
  Object.assign(SE_PLAYERS, {
    whoosh(){ xNoiseSweep(0.55, 300, 4000, 0.3); },
    call(){ xTone(1046, 0.10, "triangle", 0.32); xTone(1568, 0.18, "triangle", 0.34, 0.09); },
    dice(){
      for(let i = 0; i < 5; i++){
        setTimeout(()=>{
          const ctx = xac(), t = ctx.currentTime;
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = "square"; o.frequency.value = 650 + Math.random() * 350;
          g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
          o.connect(g); g.connect(seGain); o.start(t); o.stop(t + 0.05);
        }, i * 70);
      }
      setTimeout(()=>{
        const ctx = xac(), t = ctx.currentTime;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(110, t + 0.12);
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
        o.connect(g); g.connect(seGain); o.start(t); o.stop(t + 0.17);
      }, 380);
    },
    clash(){
      const ctx = xac(), t = ctx.currentTime;
      const s = ctx.createBufferSource(); s.buffer = xNoise2();
      const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600; f.Q.value = 1.1;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.17, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      s.connect(f); f.connect(g); g.connect(seGain); s.start(t); s.stop(t + 0.2);
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = "triangle"; o.frequency.value = 1200;
      og.gain.setValueAtTime(0.05, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.connect(og); og.connect(seGain); o.start(t); o.stop(t + 0.16);
    },
    down(){
      const ctx = xac(), t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.35);
      g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.connect(g); g.connect(seGain); o.start(t); o.stop(t + 0.42);
    },
    bell(){
      const ctx = xac(), now = ctx.currentTime;
      [[1760,0.20],[2640,0.09],[3520,0.05]].forEach(p=>{
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = p[0];
        g.gain.setValueAtTime(p[1], now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
        o.connect(g); g.connect(seGain); o.start(now); o.stop(now + 1.9);
      });
    },
    bossvictory(){
      const ctx = xac(), now = ctx.currentTime;
      const d1 = ctx.createOscillator(); d1.type = "sawtooth"; d1.frequency.value = 55;
      const d2 = ctx.createOscillator(); d2.type = "sawtooth"; d2.frequency.value = 55.6;
      const dg = ctx.createGain();
      dg.gain.setValueAtTime(0.0001, now);
      dg.gain.exponentialRampToValueAtTime(0.09, now + 0.35);
      dg.gain.exponentialRampToValueAtTime(0.0001, now + 3.2);
      d1.connect(dg); d2.connect(dg); dg.connect(seGain);
      d1.start(now); d2.start(now); d1.stop(now + 3.3); d2.stop(now + 3.3);
      [440, 392, 349.23, 311.13].forEach((freq, i)=>{
        const t = now + 0.15 + i * 0.32;
        const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.11, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
        o.connect(g); g.connect(seGain); o.start(t); o.stop(t + 0.46);
      });
      setTimeout(()=>{ xBeep(50, 0.9, "sine", 0.3); xBeep(75, 0.7, "sine", 0.15); }, 1500);
    },
    ending(){
      const ctx = xac(), now = ctx.currentTime;
      [261.63, 329.63, 392.00, 523.25].forEach(freq=>{
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = freq;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.055, now + 0.9);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 4.2);
        o.connect(g); g.connect(seGain); o.start(now); o.stop(now + 4.3);
      });
      [{f:523.25,t:0.3,d:0.5},{f:587.33,t:0.9,d:0.4},{f:659.25,t:1.4,d:0.4},

  // (A) OfflineAudioContextで1ループ事前レンダリング → loop再生（闘技場 / 魔王の城）
  const xRenderCache = {};
  let xRenderSrc = null;
  function xStopRenderBgm(){
    if(xRenderSrc){ try { xRenderSrc.stop(); } catch(e){} xRenderSrc = null; }
  }
  function xPlayRenderBgm(buf){
    ensureAudio();
    xStopRenderBgm();
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const g = audioCtx.createGain(); g.gain.value = 0.28; // レンダリング済みループの整音
    src.connect(g); g.connect(bgmGain);
    src.start();
    xRenderSrc = src;
  }
  function xEnsureRenderBgm(key, renderFn, loopDur){
    if(xRenderCache[key]){ xPlayRenderBgm(xRenderCache[key]); return; }
    const SR = 44100;
    const oCtx = new OfflineAudioContext(1, Math.ceil(loopDur * SR), SR);
    renderFn(oCtx, loopDur, SR);
    oCtx.startRendering().then(buf=>{
      xRenderCache[key] = buf;
      if(currentBGM === key) xPlayRenderBgm(buf);
    });
  }
  function xrNoiseChunk(oCtx, dur, SR){
    const buf = oCtx.createBuffer(1, Math.ceil(dur * SR), SR);
    const d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function xrKick(oCtx, t){
    const o = oCtx.createOscillator(), g = oCtx.createGain();
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.22);
    g.gain.setValueAtTime(0.75, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(oCtx.destination); o.start(t); o.stop(t + 0.23);
  }
  function xrSnare(oCtx, t, SR){
    const ns = oCtx.createBufferSource(); ns.buffer = xrNoiseChunk(oCtx, 0.14, SR);
    const hp = oCtx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
    const g = oCtx.createGain();
    g.gain.setValueAtTime(0.38, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    ns.connect(hp); hp.connect(g); g.connect(oCtx.destination); ns.start(t);
    const o = oCtx.createOscillator(), og = oCtx.createGain();
    o.frequency.value = 200; og.gain.setValueAtTime(0.10, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(og); og.connect(oCtx.destination); o.start(t); o.stop(t + 0.08);
  }
  function xrHat(oCtx, t, dur, vol, SR){
    const ns = oCtx.createBufferSource(); ns.buffer = xrNoiseChunk(oCtx, dur, SR);
    const hp = oCtx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 9000;
    const g = oCtx.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    ns.connect(hp); hp.connect(g); g.connect(oCtx.destination); ns.start(t);
  }
  function xrTone(oCtx, t, freq, dur, type, vol){
    const o = oCtx.createOscillator(), g = oCtx.createGain();
    o.type = type || "sawtooth"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + Math.min(0.06, dur * 0.3));
    g.gain.setValueAtTime(vol, t + dur - 0.05);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(oCtx.destination); o.start(t); o.stop(t + dur + 0.01);

    });
    [[0,110,1.8],[2,116.5,0.6],[2.5,98,1.5],[4,110,1.8],[6,87.3,0.9],[7,82.4,1.3]
    ].forEach(n=> xrTone(oCtx, n[0] * beat, n[1], n[2] * beat, "sawtooth", 0.10));
    [[1,220,0.5],[3,233,0.5],[5,196,0.8],[7,185,1.0]
    ].forEach(n=> xrTone(oCtx, n[0] * beat, n[1], n[2] * beat, "sine", 0.05));
  }

  // (B) リアルタイム16分音符シーケンサ（昼 / レース / パニック / ロック）
  const xSeqState = { playing:false, timer:null, nextTime:0, step:0, dt:0, stepFn:null };
  function xSeqStop(){
    xSeqState.playing = false;
    if(xSeqState.timer){ clearInterval(xSeqState.timer); xSeqState.timer = null; }
  }
  function xSeqStart(bpm, stepFn){
    ensureAudio();
    xSeqStop();
    xSeqState.playing = true;
    xSeqState.step = 0;
    xSeqState.dt = 60 / bpm / 4;
    xSeqState.stepFn = stepFn;
    xSeqState.nextTime = audioCtx.currentTime + 0.05;
    xSeqState.timer = setInterval(()=>{
      if(!xSeqState.playing) return;
      while(xSeqState.nextTime < audioCtx.currentTime + 0.12){
        xSeqState.stepFn(xSeqState.step % 16, xSeqState.nextTime, xSeqState.dt, xSeqState.step);
        xSeqState.nextTime += xSeqState.dt;
        xSeqState.step++;
      }
    }, 25);
  }
  function xbKick(t, vol){
    const ctx = xac();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(vol == null ? 0.13 : vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t + 0.16);
  }
  function xbSnare(t, vol){
    const ctx = xac();
    const s = ctx.createBufferSource(); s.buffer = xNoise2();
    const f = ctx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol == null ? 0.07 : vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    s.connect(f); f.connect(g); g.connect(bgmGain); s.start(t); s.stop(t + 0.1);
  }
  function xbHat(t, vol, dur){
    const ctx = xac();
    const s = ctx.createBufferSource(); s.buffer = xNoise2();
    const f = ctx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6500;
    const g = ctx.createGain();
    const dd = dur || 0.03;
    g.gain.setValueAtTime(vol == null ? 0.035 : vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dd);
    s.connect(f); f.connect(g); g.connect(bgmGain); s.start(t); s.stop(t + dd);
  }
  function xbNote(freq, t, dur, type, vol){
    const ctx = xac();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol == null ? 0.045 : vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(bgmGain); o.start(t); o.stop(t + dur);
  }
  const X_DAY_RIFF  = [82.41, 82.41, 98, 82.41, 110, 98, 82.41, 73.42];
  const X_RACE_BASS = [55, 0, 55, 65.41, 73.42, 0, 55, 65.41, 82.41, 0, 73.42, 65.41, 55, 65.41, 73.42, 82.41];
  const X_RACE_ARP  = [220, 261.6, 329.6, 440, 329.6, 261.6];
  const X_ROCK_RIFF = [82.41, 82.41, 98, 82.41, 110, 98, 82.41, 73.42];
  function xDayStep(s, t, dt){
    if(s % 2 === 0){
      const f = X_DAY_RIFF[(s / 2) | 0];
      xbNote(f, t, dt * 1.6, "sawtooth", 0.055);
      xbNote(f * 1.5, t, dt * 1.6, "sawtooth", 0.035);
    }
    if(s % 4 === 0) xbKick(t, 0.11);
    if(s === 4 || s === 12) xbSnare(t);
    if(s % 2 === 0) xbHat(t, 0.025);
  }
  function xRaceStep(s, t, dt, gstep){
    xbHat(t, s % 4 === 0 ? 0.05 : 0.03);
    if(s % 4 === 0) xbKick(t, 0.11);
    const b = X_RACE_BASS[s];
    if(b) xbNote(b, t, dt * 1.7, "square", 0.05);
    if(s % 2 === 1) xbNote(X_RACE_ARP[(gstep >> 1) % X_RACE_ARP.length], t, dt * 1.2, "triangle", 0.028);
  }
  function xPanicStep(s, t, dt){
    if(s === 0){ xbNote(1800, t, 0.025, "square", 0.055); xbNote(55, t, dt * 15, "sawtooth", 0.02); }
    if(s === 8) xbNote(1400, t, 0.025, "square", 0.055);
    if(s === 0) xbKick(t, 0.13);
    if(s === 3) xbKick(t, 0.09);
    if(s === 4 || s === 12) xbHat(t, 0.04);
  }
  function xRockStep(s, t, dt){
    if(s % 2 === 0){
      const f = X_ROCK_RIFF[(s / 2) | 0];
      xbNote(f, t, dt * 1.6, "sawtooth", 0.055);
      xbNote(f * 1.5, t, dt * 1.6, "sawtooth", 0.035);
    }
    if(s % 4 === 0) xbKick(t, 0.11);
    if(s === 4 || s === 12) xbSnare(t);
    if(s % 2 === 0) xbHat(t, 0.025);
  }
  const BGM_ENGINES = {
    arena: { start(){ xEnsureRenderBgm("arena", xrRenderArena, 60 / 140 * 8); }, stop: xStopRenderBgm },
    boss:  { start(){ xEnsureRenderBgm("boss",  xrRenderBoss,  60 / 75  * 8); }, stop: xStopRenderBgm },
    day:   { start(){ xSeqStart(144, xDayStep);   }, stop: xSeqStop },
    race:  { start(){ xSeqStart(152, xRaceStep);  }, stop: xSeqStop },
    panic: { start(){ xSeqStart(118, xPanicStep); }, stop: xSeqStop },
    rock:  { start(){ xSeqStart(144, xRockStep);  }, stop: xSeqStop }
  };

  let currentBGM = null;   // 現在再生中のID
  let bgmToken = 0;        // 再生セッション識別用

  const bgmAudioEls = {};   // id -> HTMLAudioElement
  const bgmMediaNodes = {}; // id -> MediaElementAudioSourceNode

  function getBgmAudio(id){
    if(!bgmAudioEls[id]){
      const el = new Audio(BGM_FILES[id]);
      el.loop = true;
      el.preload = "auto";
      bgmAudioEls[id] = el;
      try {
        const node = audioCtx.createMediaElementSource(el);
        node.connect(bgmGain);
        bgmMediaNodes[id] = node;
      } catch(e){
        el.volume = bgmLevel(); // MediaElementSource不可なら素の音量で
      }
    }
    return bgmAudioEls[id];
  }

  function stopBGM(){
    currentBGM = null;
    bgmToken++;
    Object.values(bgmAudioEls).forEach(el=>{ el.pause(); el.currentTime = 0; });
    xStopRenderBgm();
    xSeqStop();
    document.querySelectorAll(".bgm-row").forEach(el=>{
      el.classList.remove("playing");
      el.querySelector(".bgm-btn").classList.remove("is-playing");
      el.querySelector(".bgm-btn").textContent = "▶ 再生";
    });
  }

  function startBGM(id){
    ensureAudio();
    if(currentBGM === id){ stopBGM(); return; }
    stopBGM();
    currentBGM = id;
    const myToken = ++bgmToken;

    const row = document.querySelector('.bgm-row[data-id="'+id+'"]');
    row.classList.add("playing");
    const btn = row.querySelector(".bgm-btn");
    btn.classList.add("is-playing");
    btn.textContent = "■ 停止";

    const meta = BGM_LIST.find(b=> b.id === id);
    if(meta && meta.type === "file"){
      const el = getBgmAudio(id);
      applyBgmVolume();
      el.currentTime = 0;
      el.play().catch(()=>{});
      return;
    }
    if(meta && meta.type === "engine" && BGM_ENGINES[id]){
      applyBgmVolume();
      BGM_ENGINES[id].start();
      return;
    }

    const pattern = BGM_PATTERNS[id];
    const stepDur = 60 / pattern.tempo / 2; // 8分音符
    let stepIndex = 0;

    function scheduleStep(){
      if(bgmToken !== myToken) return; // 停止済み
      const t = audioCtx.currentTime + 0.02;
      const freq = pattern.notes[stepIndex % pattern.notes.length];
      tone(freq, t, stepDur * 0.9, pattern.wave, 0.3, bgmGain);
      stepIndex++;
      setTimeout(scheduleStep, stepDur * 1000);
    }
    scheduleStep();
  }

  /* ================= UI Build ================= */
  const seGrid = document.getElementById("seGrid");
  SE_LIST.forEach(se=>{
    const btn = document.createElement("button");
    btn.className = "se-btn c-" + se.color;
    btn.innerHTML = '<span class="icon">'+se.icon+'</span><span class="label">'+se.label+'</span>';
    btn.addEventListener("pointerdown", ()=>{
      ensureAudio();
      SE_PLAYERS[se.id]();
      btn.classList.add("is-pressed");
      setTimeout(()=> btn.classList.remove("is-pressed"), 350);
    });
    seGrid.appendChild(btn);
  });

  const bgmListEl = document.getElementById("bgmList");
  BGM_LIST.forEach(b=>{
    const row = document.createElement("div");
    row.className = "bgm-row";
    row.dataset.id = b.id;
    row.innerHTML =
      '<div class="viz"><i></i><i></i><i></i><i></i></div>' +
      '<div class="bgm-info">' +
        '<div class="bgm-name">'+b.label+'</div>' +
        '<div class="bgm-sub">'+b.sub+'</div>' +
      '</div>' +
      '<button class="bgm-btn">▶ 再生</button>';
    row.querySelector(".bgm-btn").addEventListener("click", ()=> startBGM(b.id));
    bgmListEl.appendChild(row);
  });

  const volumeToggle = document.getElementById("bgmVolumeToggle");
  const volumeButtons = volumeToggle.querySelectorAll(".toggle-btn");
  function refreshVolumeButtons(){
    volumeButtons.forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.mode === bgmVolumeMode);
    });
  }
  volumeButtons.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      bgmVolumeMode = btn.dataset.mode;
      refreshVolumeButtons();
      ensureAudio();
      applyBgmVolume();
    });
  });
  refreshVolumeButtons();

})();
</script>
</body>
